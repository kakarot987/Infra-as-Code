name: "Terraform Plan"

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"

env:
  TF_VERSION: "1.7.0"
  WORKING_DIR: "./terraform"

jobs:
  terraform-lint:
    name: "Lint & Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Run TFLint
        run: |
          cd ${{ env.WORKING_DIR }}
          tflint --init
          tflint --recursive

      - name: Run Checkov (Security Scan)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.WORKING_DIR }}
          framework: terraform
          output_format: cli
          soft_fail: false
          skip_check: CKV_GCP_999  # Add any org-approved exceptions here

  terraform-plan-dev:
    name: "Plan — dev"
    runs-on: ubuntu-latest
    needs: terraform-lint
    environment: dev
    permissions:
      contents: read
      pull-requests: write
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (dev)
        run: |
          cd ${{ env.WORKING_DIR }}
          terraform init -backend-config=environments/dev/backend.conf

      - name: Terraform Plan (dev)
        id: plan
        run: |
          cd ${{ env.WORKING_DIR }}
          terraform plan \
            -var-file=environments/dev/dev.tfvars \
            -out=tfplan-dev \
            -no-color 2>&1 | tee plan-output.txt
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('${{ env.WORKING_DIR }}/plan-output.txt', 'utf8');
            const truncated = output.length > 60000
              ? output.substring(0, 60000) + '\n\n...output truncated...'
              : output;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔍 Terraform Plan — \`dev\`\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

      - name: Fail on Plan Error
        if: steps.plan.outcome == 'failure'
        run: exit 1
