name: "Terraform Plan"

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/tf-plan.yml"

env:
  TF_VERSION: "1.7.0"
  WORKING_DIR: "./terraform"

jobs:
  terraform-lint:
    name: "Lint & Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Init (no backend)
        run: terraform init -backend=false
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.WORKING_DIR }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Run TFLint
        run: |
          cd ${{ env.WORKING_DIR }}
          tflint --init
          tflint --recursive

      - name: Run Checkov (Security Scan)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.WORKING_DIR }}
          framework: terraform
          output_format: cli
          soft_fail: false
          skip_check: CKV_GCP_999  # Add any org-approved exceptions here

  terraform-plan-dev:
    name: "Plan — dev (GCP opt-in)"
    runs-on: ubuntu-latest
    needs: terraform-lint
    # This repository can be validated without provisioning cloud resources.
    # Set repository Actions variable GCP_PLAN_ENABLED=true only after WIF,
    # GCS backend, project IDs and Terraform secrets are configured.
    # Do not expose environment secrets to pull requests from forks.
    if: ${{ vars.GCP_PLAN_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    environment: dev
    env:
      TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
      TF_VAR_datadog_api_key: ${{ secrets.TF_VAR_datadog_api_key }}
      TF_VAR_datadog_app_key: ${{ secrets.TF_VAR_datadog_app_key }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required environment secrets
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          SA_EMAIL: ${{ secrets.GCP_SA_EMAIL }}
          DB_PASSWORD: ${{ secrets.TF_VAR_db_password }}
          DATADOG_API_KEY: ${{ secrets.TF_VAR_datadog_api_key }}
          DATADOG_APP_KEY: ${{ secrets.TF_VAR_datadog_app_key }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$WIF_PROVIDER" ]] || missing+=(GCP_WIF_PROVIDER)
          [[ -n "$SA_EMAIL" ]] || missing+=(GCP_SA_EMAIL)
          [[ -n "$DB_PASSWORD" ]] || missing+=(TF_VAR_db_password)
          [[ -n "$DATADOG_API_KEY" ]] || missing+=(TF_VAR_datadog_api_key)
          [[ -n "$DATADOG_APP_KEY" ]] || missing+=(TF_VAR_datadog_app_key)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing dev environment/repository secrets: ${missing[*]}"
            echo "::error::Add the missing secrets in Settings → Environments → dev → Environment secrets, or repository Actions secrets."
            exit 1
          fi
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init (dev)
        run: |
          cd ${{ env.WORKING_DIR }}
          terraform init -backend-config=environments/dev/backend.conf

      - name: Terraform Plan (dev)
        id: plan
        run: |
          set -o pipefail
          cd ${{ env.WORKING_DIR }}
          terraform plan \
            -var-file=environments/dev/dev.tfvars \
            -out=tfplan-dev \
            -no-color 2>&1 | tee plan-output.txt
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('${{ env.WORKING_DIR }}/plan-output.txt', 'utf8');
            const truncated = output.length > 60000
              ? output.substring(0, 60000) + '\n\n...output truncated...'
              : output;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔍 Terraform Plan — \`dev\`\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

      - name: Fail on Plan Error
        if: steps.plan.outcome == 'failure'
        run: exit 1
